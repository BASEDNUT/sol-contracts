[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

remappings = [
    "@eas/contracts/=lib/eas-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.wnut]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
optimizer = false
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"
remappings = [
    "@eas/contracts/=lib/eas-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
